name: content

# Validate content metadata and catalog on every pull request, build and
# publish Docker images from main, then refresh catalog.json.
#
# Required repository secrets (main branch only):
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN
#
# The workflow never uses pull_request_target and never exposes Docker Hub
# credentials to pull requests: PR runs only build images, they never log in
# and never push.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_all:
        description: Build and publish every image with a Dockerfile
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate content metadata
        run: python3 scripts/content.py validate

      - name: Check catalog.json is up to date
        run: python3 scripts/content.py catalog --check

      - name: Run unit tests
        run: python3 -m unittest discover -s scripts/tests -v

  detect:
    name: Detect changed content
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.changed.outputs.paths }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Detect changed challenges and gameboxes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_ALL: ${{ inputs.build_all }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$BUILD_ALL" == "true" ]]; then
              python3 scripts/content.py changed \
                --all --dockerfile-only --github-output "$GITHUB_OUTPUT"
            else
              # Manual runs without build_all only validate and refresh catalog.
              echo 'paths=[]' >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          python3 scripts/content.py changed \
            --base "$BASE" \
            --head "$HEAD_SHA" \
            --dockerfile-only \
            --github-output "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.path }}
    needs: detect
    if: needs.detect.outputs.paths != '[]' && needs.detect.outputs.paths != ''
    runs-on: ubuntu-latest
    env:
      # Pull requests only build; push and manual runs publish.
      PUBLISH: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        path: ${{ fromJSON(needs.detect.outputs.paths) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image metadata
        id: image
        run: |
          python3 scripts/content.py image-meta "${{ matrix.path }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.image.outputs.image }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  catalog:
    name: Update catalog.json
    needs:
      - validate
      - detect
      - build
    if: |
      always()
      && github.event_name != 'pull_request'
      && needs.validate.result == 'success'
      && needs.detect.result == 'success'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate catalog.json
        run: python3 scripts/content.py catalog

      - name: Commit catalog.json
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- catalog.json)" ]]; then
            echo "catalog.json is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: update catalog [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
